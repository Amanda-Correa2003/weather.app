<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicativo do Tempo</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1><i class="fa-solid fa-cloud-sun"></i> Aplicativo do Tempo</h1>
      <div class="search-box">
        <input type="text" id="city-input" placeholder="Pesquisar cidade..." autocomplete="off">
        <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </header>

    <div id="message-container" class="message-container hidden">
      <p id="message-text"></p>
    </div>

    <main id="weather-content" class="weather-content hidden">
      <section class="current-weather">
        <div class="current-main">
          <div class="location-info">
            <h2 id="city-name">--</h2>
            <span id="current-date">--</span>
          </div>
          <div class="temp-container">
            <img id="weather-icon" src="" alt="Ícone do clima">
            <div>
              <span id="temperature">--°</span>
              <p id="description">--</p>
            </div>
          </div>
        </div>
        <div class="current-secondary">
          <div class="temp-range">
            <span><i class="fa-solid fa-arrow-up"></i> Máx: <strong id="temp-max">--°</strong></span>
            <span><i class="fa-solid fa-arrow-down"></i> Mín: <strong id="temp-min">--°</strong></span>
          </div>
          <p class="feels-like">Sensação térmica de <strong id="feels-like">--°</strong></p>
        </div>
      </section>

      <section class="details-grid">
        <div class="detail-card">
          <i class="fa-solid fa-droplet"></i>
          <div>
            <span>Umidade</span>
            <strong id="humidity">--%</strong>
          </div>
        </div>
        <div class="detail-card">
          <i class="fa-solid fa-wind"></i>
          <div>
            <span>Vento</span>
            <strong id="wind-speed">-- km/h</strong>
          </div>
        </div>
        <div class="detail-card">
          <i class="fa-solid fa-gauge-high"></i>
          <div>
            <span>Pressão</span>
            <strong id="pressure">-- hPa</strong>
          </div>
        </div>
        <div class="detail-card">
          <i class="fa-solid fa-eye"></i>
          <div>
            <span>Visibilidade</span>
            <strong id="visibility">-- km</strong>
          </div>
        </div>
        <div class="detail-card">
          <i class="fa-solid fa-sun"></i>
          <div>
            <span>Nascer do Sol</span>
            <strong id="sunrise">--:--</strong>
          </div>
        </div>
        <div class="detail-card">
          <i class="fa-solid fa-moon"></i>
          <div>
            <span>Pôr do Sol</span>
            <strong id="sunset">--:--</strong>
          </div>
        </div>
      </section>

      <section class="forecast-section">
        <h3>Previsão para 5 dias</h3>
        <div id="forecast-container" class="forecast-container"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
